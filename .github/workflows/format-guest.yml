name: Format Nandini feature files
on:
  push:
    branches:
      - feature/private-friendship-notes
jobs:
  format:
    if: github.repository == 'sam300705/Nandini'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format current feature files
        run: |
          ./node_modules/.bin/prettier --write \
            src/components/nandini/HomeTab.tsx \
            src/components/nandini/VoiceCompanion.tsx \
            supabase/functions/guest-sarvam-companion/index.ts
      - name: Commit formatting changes on feature branch
        run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'Nandini Formatter'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/components/nandini/HomeTab.tsx src/components/nandini/VoiceCompanion.tsx supabase/functions/guest-sarvam-companion/index.ts
            git commit -m 'style: format photo and guest teddy implementation'
            git push origin HEAD:refs/heads/feature/private-friendship-notes
          fi
