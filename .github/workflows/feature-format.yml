name: Feature code formatting
on:
  push:
    branches:
      - feature/private-friendship-notes
jobs:
  format:
    if: github.repository == 'sam300705/Nandini'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format source using repository Prettier configuration
        run: |
          ./node_modules/.bin/prettier --write \
            public/sw.js \
            src/components/nandini/DiaryTab.tsx \
            src/components/nandini/FriendshipNote.tsx \
            src/components/nandini/HomeTab.tsx \
            src/components/nandini/LockScreen.tsx \
            src/components/nandini/TeddyScene.tsx \
            src/components/nandini/TogetherDiaryTab.tsx \
            src/components/nandini/VoiceCompanion.tsx \
            src/components/nandini/teddy-animation.ts \
            src/components/ui/badge.tsx \
            src/components/ui/button.tsx \
            src/components/ui/form.tsx \
            src/components/ui/navigation-menu.tsx \
            src/components/ui/sidebar.tsx \
            src/components/ui/toggle.tsx \
            src/integrations/supabase/client.ts \
            src/lib/friendshipLetter.test.ts \
            src/lib/friendshipLetter.ts \
            src/routes/__root.tsx \
            src/routes/index.tsx \
            src/test/privateApp.test.tsx \
            src/test/voice-conversation.test.ts \
            src/test/voice-speech.test.ts \
            supabase/functions/sarvam-companion/conversation.ts \
            supabase/functions/sarvam-companion/index.ts \
            supabase/functions/sarvam-companion/speech.ts
      - name: Commit reversible formatting changes to feature branch only
        run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'Nandini Feature Formatter'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'style: format affected sources with Prettier'
            git push origin HEAD:refs/heads/feature/private-friendship-notes
          fi
